
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Киностудия{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243247;
        }

        header {
            background: #263b60;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        nav {
            background: #344e79;
            padding: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
            overflow-x: auto;
        }

        h2 {
            color: #263b60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e7edf7;
        }

        tr:hover {
            background: #f4f7fc;
        }

        .button {
            display: inline-block;
            background: #344e79;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #263b60;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .error {
            color: #b91c1c;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>🎬 Киностудия</h1>
    <p>Информационная система управления фильмами</p>
</header>

<nav>
    <a href="{% url 'home' %}">Главная</a>
    <a href="{% url 'movie_list' %}">Фильмы</a>
    <a href="{% url 'actor_search' %}">Актёры</a>
    <a href="{% url 'movie_create' %}">Добавить фильм</a>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    Здраво. Како си?
</footer>

</body>
</html>
